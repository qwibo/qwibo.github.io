<!-- _includes/seo_settings.html -->
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="keywords" content="{{ page.keywords | default: site.keywords | join: ',' }}">
<meta name="author" content="{{ page.author | default: site.author.name }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image | default: page.og_image | default: site.og_image | prepend: site.url }}">
{%- unless page.image or page.og_image %}
<meta property="og:image:secure_url" content="{{ page.image | default: page.og_image | default: site.og_image | prepend: site.url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta property="og:image:alt" content="{{ site.og_image_alt }}">
{%- endunless %}
<meta property="og:type" content="website">
<meta property="og:locale" content="{{ page.locale | default: site.locale }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ page.image | default: page.og_image | default: site.og_image | prepend: site.url }}">
